<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Wall CoR — EN/FR/DE</title>
<style>
  :root{
    --eu-blue:#003399; --eu-blue-2:#0b1e5b; --eu-gold:#ffd617; --eu-gold-2:#ffcc00;
    --ink:#0a1330; --panel:rgba(9,20,55,.72); --panel-line:rgba(255,214,23,.35);
    --ok:#3ddc84; --bad:#ff5a6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05081c;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  video{position:absolute;inset:0;width:1px;height:1px;opacity:0;pointer-events:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:4vmin;z-index:5;pointer-events:none}
  .overlay .card,.overlay button,.overlay .modes,.overlay .camwrap,.overlay select,.overlay .langsw{pointer-events:auto}

  .brandbar{position:absolute;top:0;left:0;right:0;height:8px;
    background:linear-gradient(90deg,var(--eu-blue),var(--eu-gold));z-index:8}

  h1{font-size:clamp(26px,4.6vmin,60px);margin:0 0 1vmin;letter-spacing:.5px}
  .sub{font-size:clamp(15px,2.1vmin,24px);opacity:.85;max-width:860px;margin:0 auto 3vmin}
  .stars{color:var(--eu-gold);letter-spacing:6px;font-size:clamp(18px,2.4vmin,28px);margin-bottom:1.4vmin}

  /* language switcher */
  .langsw{display:inline-flex;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:4px;margin-bottom:3vmin}
  .langsw button{border:none;background:transparent;color:#fff;font-weight:700;font-size:15px;
    padding:8px 16px;border-radius:999px;cursor:pointer;opacity:.7;transition:.15s}
  .langsw button.active{background:var(--eu-gold);color:var(--ink);opacity:1}

  .modes{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center;max-width:1100px}
  .mode{width:min(300px,80vw);background:var(--panel);border:1px solid var(--panel-line);
    border-radius:22px;padding:3vmin 2.4vmin;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;backdrop-filter:blur(6px)}
  .mode:hover{transform:translateY(-6px);border-color:var(--eu-gold);box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .mode .ico{font-size:56px;line-height:1;margin-bottom:14px}
  .mode h3{margin:0 0 8px;font-size:clamp(19px,2.5vmin,26px)}
  .mode p{margin:0;opacity:.8;font-size:clamp(13px,1.7vmin,17px);line-height:1.4}

  .btn{border:none;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:600;cursor:pointer;
    background:var(--eu-gold);color:var(--ink);transition:filter .15s,transform .1s}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .camwrap{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 16px;font-size:15px}
  .camsel{background:transparent;color:#fff;border:none;font-size:15px;max-width:230px;cursor:pointer;outline:none}
  .camsel option{color:#000}

  #hud{position:absolute;top:16px;left:16px;right:16px;z-index:6;display:none;
    justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
  #hud .left,#hud .right{display:flex;gap:10px;align-items:center;pointer-events:auto}
  .pill{background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;
    padding:10px 18px;font-weight:700;font-size:clamp(15px,2vmin,22px)}
  .pill small{display:block;font-weight:500;opacity:.7;font-size:.6em;letter-spacing:.5px}

  #boot{z-index:9}
  .spinner{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.2);
    border-top-color:var(--eu-gold);animation:spin 1s linear infinite;margin-bottom:18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{max-width:660px;background:var(--panel);border:1px solid var(--bad);border-radius:18px;padding:26px}
  .hide{display:none!important}
  .footnote{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.55;z-index:6}
</style>
</head>
<body>
<div class="brandbar"></div>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
</div>

<div id="boot" class="overlay">
  <div class="spinner" id="spin"></div>
  <div id="bootmsg" class="sub" style="margin:0">Loading…</div>
  <div id="booterr" class="err hide"></div>
</div>

<div id="menu" class="overlay hide">
  <div class="langsw" id="langsw">
    <button data-lang="en">EN</button>
    <button data-lang="fr">FR</button>
    <button data-lang="de">DE</button>
  </div>
  <div class="stars">★ ★ ★</div>
  <h1 id="m_title"></h1>
  <p class="sub" id="m_sub"></p>
  <div class="modes">
    <div class="mode" data-mode="quiz">
      <div class="ico">🧠</div>
      <h3 id="q_t"></h3><p id="q_d"></p>
    </div>
    <div class="mode" data-mode="catch">
      <div class="ico">⭐</div>
      <h3 id="c_t"></h3><p id="c_d"></p>
    </div>
    <div class="mode" data-mode="particles">
      <div class="ico">✨</div>
      <h3 id="p_t"></h3><p id="p_d"></p>
    </div>
  </div>
  <div style="margin-top:4vmin;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center">
    <label class="camwrap">📷&nbsp;<select id="camSel" class="camsel"></select></label>
    <button class="btn ghost" id="fsBtn"></button>
  </div>
</div>

<div id="hud">
  <div class="left">
    <button class="btn ghost" id="backBtn"></button>
    <span class="pill" id="hudTitle"></span>
  </div>
  <div class="right">
    <span class="pill hide" id="scorePill"><small id="lblScore">SCORE</small><span id="score">0</span></span>
    <span class="pill hide" id="timePill"><small id="lblTime">TIME</small><span id="time">45</span></span>
    <span class="pill hide" id="peoplePill"><small id="lblPeople">PEOPLE</small><span id="people">0</span></span>
  </div>
</div>

<div class="footnote" id="footnote"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============================ i18n ============================ */
  const I18N = {
    en:{
      title:"Interactive Wall — European Committee of the Regions",
      sub:"Stand in front of the camera and pick a mode. You play with your body — no controller. Best projected on a wall.",
      q_t:"Body Quiz", q_d:"Answer by moving your hand into the right zone. Questions on the EU and its regions.",
      c_t:"Catch the Stars", c_d:"Stars fall — catch them with your hands. Score in 45 seconds.",
      p_t:"Particle Mirror", p_d:"Your body draws trails of particles in Europe's colours.",
      fullscreen:"⛶ Fullscreen", back:"← Menu",
      hud_quiz:"🧠 Body Quiz", hud_catch:"⭐ Catch the Stars", hud_particles:"✨ Particle Mirror",
      lblScore:"SCORE", lblTime:"TIME", lblPeople:"PEOPLE",
      quiz_instr:"✋ Keep one hand in the zone of your choice",
      quiz_ok:"✔ Correct!", quiz_no:"✘ Wrong!",
      catch_end:"Done! Stars caught: {n} ⭐",
      part_prompt:"Move in front of the camera ✨",
      boot_perm:"Allow camera access…", boot_model:"Loading detection model (MoveNet)…",
      err_title:"Unable to start.", err_denied:"Camera access was denied. Allow the camera and reload.",
      err_nocam:"No camera detected. Plug in your webcam and reload.",
      err_hint:"Tip: open the file in Chrome, or host it over HTTPS (Netlify).",
      cam_changed:"Camera switched ✔", cam_unavail:"Camera unavailable: ",
      cam_busy:"already in use by another app", cam_over:"resolution not supported", cam_denied:"access denied",
      footnote:"Webcam · TensorFlow.js MoveNet · nothing is sent, everything runs in your browser"
    },
    fr:{
      title:"Mur interactif — Comité européen des régions",
      sub:"Place-toi devant la caméra et choisis un mode. Tu joues avec ton corps, sans manette. Idéal projeté sur un mur.",
      q_t:"Quiz corporel", q_d:"Réponds en déplaçant ta main vers la bonne zone. Questions sur l'UE et les régions.",
      c_t:"Attrape les étoiles", c_d:"Des étoiles tombent : attrape-les avec tes mains. Score en 45 secondes.",
      p_t:"Miroir de particules", p_d:"Ton corps dessine des traînées de particules aux couleurs de l'Europe.",
      fullscreen:"⛶ Plein écran", back:"← Menu",
      hud_quiz:"🧠 Quiz corporel", hud_catch:"⭐ Attrape les étoiles", hud_particles:"✨ Miroir de particules",
      lblScore:"SCORE", lblTime:"TEMPS", lblPeople:"PERSONNES",
      quiz_instr:"✋ Garde une main dans la zone de ton choix",
      quiz_ok:"✔ Bonne réponse !", quiz_no:"✘ Raté !",
      catch_end:"Terminé ! Étoiles attrapées : {n} ⭐",
      part_prompt:"Bouge devant la caméra ✨",
      boot_perm:"Autorise l'accès à la caméra…", boot_model:"Chargement du modèle de détection (MoveNet)…",
      err_title:"Impossible de démarrer.", err_denied:"L'accès à la caméra a été refusé. Autorise-la puis recharge.",
      err_nocam:"Aucune caméra détectée. Branche ta webcam et recharge.",
      err_hint:"Astuce : ouvre le fichier dans Chrome, ou héberge-le en HTTPS (Netlify).",
      cam_changed:"Caméra changée ✔", cam_unavail:"Caméra indisponible : ",
      cam_busy:"déjà utilisée par une autre appli", cam_over:"résolution non supportée", cam_denied:"accès refusé",
      footnote:"Webcam · TensorFlow.js MoveNet · aucune donnée envoyée, tout tourne dans le navigateur"
    },
    de:{
      title:"Interaktive Wand — Europäischer Ausschuss der Regionen",
      sub:"Stell dich vor die Kamera und wähle einen Modus. Du spielst mit deinem Körper – ohne Controller. Ideal an eine Wand projiziert.",
      q_t:"Körper-Quiz", q_d:"Antworte, indem du deine Hand in die richtige Zone bewegst. Fragen zur EU und ihren Regionen.",
      c_t:"Fang die Sterne", c_d:"Sterne fallen – fang sie mit deinen Händen. Punkte in 45 Sekunden.",
      p_t:"Partikel-Spiegel", p_d:"Dein Körper zeichnet Partikelspuren in den Farben Europas.",
      fullscreen:"⛶ Vollbild", back:"← Menü",
      hud_quiz:"🧠 Körper-Quiz", hud_catch:"⭐ Fang die Sterne", hud_particles:"✨ Partikel-Spiegel",
      lblScore:"PUNKTE", lblTime:"ZEIT", lblPeople:"PERSONEN",
      quiz_instr:"✋ Halte eine Hand in der Zone deiner Wahl",
      quiz_ok:"✔ Richtig!", quiz_no:"✘ Falsch!",
      catch_end:"Fertig! Gefangene Sterne: {n} ⭐",
      part_prompt:"Beweg dich vor der Kamera ✨",
      boot_perm:"Erlaube den Kamerazugriff…", boot_model:"Erkennungsmodell wird geladen (MoveNet)…",
      err_title:"Start nicht möglich.", err_denied:"Kamerazugriff verweigert. Erlaube die Kamera und lade neu.",
      err_nocam:"Keine Kamera erkannt. Schließe deine Webcam an und lade neu.",
      err_hint:"Tipp: Öffne die Datei in Chrome oder hoste sie über HTTPS (Netlify).",
      cam_changed:"Kamera gewechselt ✔", cam_unavail:"Kamera nicht verfügbar: ",
      cam_busy:"bereits von einer anderen App benutzt", cam_over:"Auflösung nicht unterstützt", cam_denied:"Zugriff verweigert",
      footnote:"Webcam · TensorFlow.js MoveNet · nichts wird gesendet, alles läuft im Browser"
    }
  };
  const QUIZ = {
    en:[
      {q:"How many member states does the EU have?", a:"27", b:"28", correct:0},
      {q:"Where is the seat of the Committee of the Regions?", a:"Brussels", b:"Strasbourg", correct:0},
      {q:"How many stars are on the European flag?", a:"12", b:"27", correct:0},
      {q:"The CoR mainly represents…", a:"Cities & regions", b:"Banks", correct:0},
      {q:"What is the motto of the European Union?", a:"United in diversity", b:"Freedom first", correct:0},
      {q:"In what year was the CoR created?", a:"1994", b:"2004", correct:0},
      {q:"On 9 May we celebrate…", a:"Europe Day", b:"Labour Day", correct:0}
    ],
    fr:[
      {q:"Combien d'États membres compte l'Union européenne ?", a:"27", b:"28", correct:0},
      {q:"Où siège le Comité européen des régions ?", a:"Bruxelles", b:"Strasbourg", correct:0},
      {q:"Combien d'étoiles sur le drapeau européen ?", a:"12", b:"27", correct:0},
      {q:"Le CoR représente avant tout…", a:"Les villes & régions", b:"Les banques", correct:0},
      {q:"Quelle est la devise de l'Union européenne ?", a:"Unie dans la diversité", b:"Liberté d'abord", correct:0},
      {q:"En quelle année le CoR a-t-il été créé ?", a:"1994", b:"2004", correct:0},
      {q:"Le 9 mai, on célèbre…", a:"La Journée de l'Europe", b:"La fête du travail", correct:0}
    ],
    de:[
      {q:"Wie viele Mitgliedstaaten hat die EU?", a:"27", b:"28", correct:0},
      {q:"Wo hat der Ausschuss der Regionen seinen Sitz?", a:"Brüssel", b:"Straßburg", correct:0},
      {q:"Wie viele Sterne hat die Europaflagge?", a:"12", b:"27", correct:0},
      {q:"Der AdR vertritt vor allem…", a:"Städte & Regionen", b:"Banken", correct:0},
      {q:"Wie lautet das Motto der Europäischen Union?", a:"In Vielfalt geeint", b:"Zuerst die Freiheit", correct:0},
      {q:"In welchem Jahr wurde der AdR gegründet?", a:"1994", b:"2004", correct:0},
      {q:"Am 9. Mai feiern wir…", a:"Europatag", b:"Tag der Arbeit", correct:0}
    ]
  };
  let lang = 'en';
  (function detect(){
    let saved=null; try{ saved=localStorage.getItem('cor_lang'); }catch(e){}
    if(saved && I18N[saved]){ lang=saved; return; }
    const nav=(navigator.language||'en').slice(0,2);
    if(I18N[nav]) lang=nav;
  })();
  function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }

  function applyLang(){
    document.documentElement.lang = lang;
    setText('m_title',t('title')); setText('m_sub',t('sub'));
    setText('q_t',t('q_t')); setText('q_d',t('q_d'));
    setText('c_t',t('c_t')); setText('c_d',t('c_d'));
    setText('p_t',t('p_t')); setText('p_d',t('p_d'));
    setText('fsBtn',t('fullscreen')); setText('backBtn',t('back'));
    setText('lblScore',t('lblScore')); setText('lblTime',t('lblTime')); setText('lblPeople',t('lblPeople'));
    setText('footnote',t('footnote'));
    updateHudTitle();
    document.querySelectorAll('#langsw button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang===lang);
    });
    // recharger la banque de questions dans la langue courante si le quiz tourne
    if(mode==='quiz' && quiz){ quiz.i = Math.min(quiz.i, QUIZ[lang].length-1); }
  }
  function setText(id,txt){ const el=document.getElementById(id); if(el) el.textContent=txt; }

  /* ============================ Setup ============================ */
  const video=document.getElementById('cam'), canvas=document.getElementById('canvas'),
        ctx=canvas.getContext('2d'), boot=document.getElementById('boot'),
        bootMsg=document.getElementById('bootmsg'), bootErr=document.getElementById('booterr'),
        spin=document.getElementById('spin'), menu=document.getElementById('menu'), hud=document.getElementById('hud');

  let detector=null, mode='menu', poses=[], W=0,H=0, vW=640,vH=480;
  const KP_MIN=0.30;
  const EU_COLORS=['#ffd617','#4d8cff','#ffffff','#6ee7ff','#ffb020','#8affc1'];

  /* ---------------- Caméra ---------------- */
  let currentStream=null;
  function constraintsFor(deviceId){
    return deviceId ? [
      { deviceId:{exact:deviceId}, width:{ideal:1280}, height:{ideal:720} },
      { deviceId:deviceId,          width:{ideal:1280}, height:{ideal:720} },
      { deviceId:{exact:deviceId} },
      { deviceId:deviceId }
    ] : [
      { facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
      true
    ];
  }
  async function tryAcquire(list){
    let stream=null,lastErr=null;
    for(const v of list){
      try{ stream=await navigator.mediaDevices.getUserMedia({video:v,audio:false}); break; }
      catch(e){ lastErr=e; }
    }
    return {stream,lastErr};
  }
  async function startCamera(deviceId){
    const list=constraintsFor(deviceId);
    let {stream,lastErr}=await tryAcquire(list);
    if(!stream && currentStream){
      currentStream.getTracks().forEach(t=>t.stop()); currentStream=null;
      await new Promise(r=>setTimeout(r,350));
      ({stream,lastErr}=await tryAcquire(list));
    }
    if(!stream) throw lastErr || new Error('no stream');
    if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
    currentStream=stream; video.srcObject=stream;
    await video.play();
    await new Promise(res=>{ if(video.readyState>=2) return res(); video.onloadedmetadata=()=>res(); });
    vW=video.videoWidth||640; vH=video.videoHeight||480;
    try{ if(deviceId) localStorage.setItem('cor_cam',deviceId); }catch(e){}
  }
  async function populateCameras(){
    try{
      const devs=await navigator.mediaDevices.enumerateDevices();
      const cams=devs.filter(d=>d.kind==='videoinput'); const sel=document.getElementById('camSel');
      sel.innerHTML=''; let activeId=null;
      if(currentStream && currentStream.getVideoTracks()[0]) activeId=currentStream.getVideoTracks()[0].getSettings().deviceId;
      cams.forEach((c,i)=>{ const o=document.createElement('option');
        o.value=c.deviceId; o.textContent=c.label||('Camera '+(i+1));
        if(c.deviceId===activeId) o.selected=true; sel.appendChild(o); });
    }catch(e){ console.warn('enumerateDevices',e); }
  }

  /* ---------------- Init ---------------- */
  async function init(){
    applyLang();
    try{
      bootMsg.textContent=t('boot_perm');
      let saved=null; try{ saved=localStorage.getItem('cor_cam'); }catch(e){}
      try{ await startCamera(saved||null); }
      catch(e){ try{ localStorage.removeItem('cor_cam'); }catch(_){} await startCamera(null); }
      await populateCameras();

      bootMsg.textContent=t('boot_model');
      await tf.ready(); try{ await tf.setBackend('webgl'); }catch(e){}
      detector=await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{
        modelType:poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
        enableTracking:true, trackerType:poseDetection.TrackerType.BoundingBox });

      resize(); window.addEventListener('resize',resize);
      boot.classList.add('hide'); showMenu(); requestAnimationFrame(loop);
    }catch(err){
      console.error(err); spin.classList.add('hide'); bootMsg.classList.add('hide');
      bootErr.classList.remove('hide');
      let msg='<b>'+t('err_title')+'</b><br><br>';
      if(err&&(err.name==='NotAllowedError'||err.name==='SecurityError')) msg+=t('err_denied');
      else if(err&&err.name==='NotFoundError') msg+=t('err_nocam');
      else msg+=(err&&err.message?err.message:err)+'<br><br>'+t('err_hint');
      bootErr.innerHTML=msg;
    }
  }
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }

  /* ---- mapping vidéo -> canvas (cover + miroir) ---- */
  let coverScale=1,offX=0,offY=0,drawW=0,drawH=0;
  function computeCover(){ coverScale=Math.max(W/vW,H/vH); drawW=vW*coverScale; drawH=vH*coverScale;
    offX=(W-drawW)/2; offY=(H-drawH)/2; }
  function mapX(x){ return offX+(vW-x)*coverScale; }
  function mapY(y){ return offY+y*coverScale; }
  function drawVideoMirrored(){
    computeCover(); ctx.save(); ctx.translate(offX+drawW,offY); ctx.scale(-1,1);
    ctx.drawImage(video,0,0,drawW,drawH); ctx.restore();
    ctx.fillStyle='rgba(5,8,28,.28)'; ctx.fillRect(0,0,W,H);
  }

  const ADJ=[[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
  function drawSkeleton(pose,color){
    ctx.lineWidth=Math.max(3,W*0.004); ctx.strokeStyle=color; ctx.fillStyle=color;
    for(const [a,b] of ADJ){ const p=pose.keypoints[a],q=pose.keypoints[b];
      if(p.score>KP_MIN&&q.score>KP_MIN){ ctx.beginPath();
        ctx.moveTo(mapX(p.x),mapY(p.y)); ctx.lineTo(mapX(q.x),mapY(q.y)); ctx.stroke(); } }
    for(const p of pose.keypoints){ if(p.score>KP_MIN){ ctx.beginPath();
      ctx.arc(mapX(p.x),mapY(p.y),Math.max(4,W*0.005),0,Math.PI*2); ctx.fill(); } }
  }
  function getHands(){ const hands=[]; for(const pose of poses){ for(const idx of [9,10]){
    const p=pose.keypoints[idx]; if(p&&p.score>KP_MIN) hands.push({x:mapX(p.x),y:mapY(p.y)}); } } return hands; }

  /* ============================ QUIZ ============================ */
  let quiz=null;
  function startQuiz(){ quiz={i:-1,dwellA:0,dwellB:0,locked:false,feedback:0,feedbackOk:false,score:0}; nextQuestion(); }
  function nextQuestion(){ quiz.i=(quiz.i+1)%QUIZ[lang].length; quiz.dwellA=0; quiz.dwellB=0; quiz.locked=false; quiz.feedback=0; }
  const DWELL_NEED=45;
  function updateQuiz(){
    const cur=QUIZ[lang][quiz.i]; const hands=getHands();
    const zoneW=W*0.34,zoneH=H*0.42,zoneY=H*0.5,zoneAx=W*0.02,zoneBx=W*0.98-zoneW;
    let inA=false,inB=false;
    for(const h of hands){
      if(h.x>zoneAx&&h.x<zoneAx+zoneW&&h.y>zoneY&&h.y<zoneY+zoneH) inA=true;
      if(h.x>zoneBx&&h.x<zoneBx+zoneW&&h.y>zoneY&&h.y<zoneY+zoneH) inB=true;
    }
    if(!quiz.locked){
      quiz.dwellA=inA?quiz.dwellA+1:Math.max(0,quiz.dwellA-2);
      quiz.dwellB=inB?quiz.dwellB+1:Math.max(0,quiz.dwellB-2);
      if(quiz.dwellA>=DWELL_NEED) answer(0); else if(quiz.dwellB>=DWELL_NEED) answer(1);
    }else{ quiz.feedback--; if(quiz.feedback<=0) nextQuestion(); }

    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='700 '+Math.round(H*0.045)+'px system-ui,sans-serif'; ctx.fillStyle='#fff';
    wrapText(cur.q,W/2,H*0.16,W*0.86,H*0.055);
    drawZone(zoneAx,zoneY,zoneW,zoneH,cur.a,quiz.dwellA/DWELL_NEED,quiz.locked&&quiz.chosen===0,quiz.locked,cur.correct===0);
    drawZone(zoneBx,zoneY,zoneW,zoneH,cur.b,quiz.dwellB/DWELL_NEED,quiz.locked&&quiz.chosen===1,quiz.locked,cur.correct===1);
    if(!quiz.locked){ ctx.font='500 '+Math.round(H*0.028)+'px system-ui,sans-serif';
      ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText(t('quiz_instr'),W/2,H*0.30); }
    else{ ctx.fillStyle=quiz.feedbackOk?'#3ddc84':'#ff5a6a';
      ctx.font='800 '+Math.round(H*0.04)+'px system-ui,sans-serif';
      ctx.fillText(quiz.feedbackOk?t('quiz_ok'):t('quiz_no'),W/2,H*0.30); }
    document.getElementById('score').textContent=quiz.score;
  }
  function answer(choice){ quiz.locked=true; quiz.chosen=choice; quiz.feedback=90;
    quiz.feedbackOk=(choice===QUIZ[lang][quiz.i].correct); if(quiz.feedbackOk) quiz.score++; }
  function drawZone(x,y,w,h,label,prog,chosen,locked,isCorrect){
    let border='rgba(255,214,23,.6)',fill='rgba(9,20,55,.55)';
    if(locked){ if(isCorrect){border='#3ddc84';fill='rgba(61,220,132,.25)';}
      else if(chosen){border='#ff5a6a';fill='rgba(255,90,106,.22)';} }
    roundRect(x,y,w,h,26); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=6; ctx.strokeStyle=border; ctx.stroke();
    if(!locked&&prog>0){ roundRect(x,y+h-16,w*Math.min(1,prog),16,8); ctx.fillStyle='#ffd617'; ctx.fill(); }
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='700 '+Math.round(h*0.16)+'px system-ui,sans-serif'; wrapText(label,x+w/2,y+h/2,w*0.86,h*0.18);
  }

  /* ============================ CATCH ============================ */
  let game=null;
  function startCatch(){ game={score:0,time:45,stars:[],bursts:[],spawn:0,last:performance.now()}; }
  function spawnStar(){ game.stars.push({x:Math.random()*W*0.86+W*0.07,y:-40,
    vy:(H*0.10)+Math.random()*(H*0.10),r:Math.max(26,W*0.022),rot:0,caught:false}); }
  function updateCatch(){
    const now=performance.now(); let dt=(now-game.last)/1000; if(dt>0.05) dt=0.05; game.last=now;
    game.time-=dt; if(game.time<=0){ endCatch(); return; }
    game.spawn-=dt; if(game.spawn<=0){ spawnStar(); game.spawn=0.55+Math.random()*0.4; }
    const hands=getHands();
    for(const s of game.stars){ s.y+=s.vy*dt; s.rot+=dt*2;
      if(!s.caught){ for(const h of hands){ if(Math.hypot(h.x-s.x,h.y-s.y)<s.r+W*0.03){
        s.caught=true; game.score++; for(let k=0;k<14;k++) game.bursts.push(burst(s.x,s.y)); break; } } } }
    game.stars=game.stars.filter(s=>!s.caught&&s.y<H+60);
    for(const s of game.stars) drawStar(s.x,s.y,s.r,s.rot,'#ffd617');
    updateBursts();
    ctx.fillStyle='rgba(77,140,255,.9)';
    for(const h of hands){ ctx.beginPath(); ctx.arc(h.x,h.y,W*0.02,0,Math.PI*2); ctx.fill(); }
    document.getElementById('score').textContent=game.score;
    document.getElementById('time').textContent=Math.max(0,Math.ceil(game.time));
  }
  function endCatch(){ const sc=game.score; setMode('menu');
    setTimeout(()=>flash(t('catch_end').replace('{n}',sc)),50); }
  function drawStar(cx,cy,r,rot,color){ ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); ctx.beginPath();
    for(let i=0;i<5;i++){ const a=(Math.PI*2*i/5)-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      const a2=a+Math.PI/5; ctx.lineTo(Math.cos(a2)*r*0.45,Math.sin(a2)*r*0.45); }
    ctx.closePath(); ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=20; ctx.fill(); ctx.restore(); ctx.shadowBlur=0; }

  /* ============================ PARTICLES ============================ */
  let particles=[], prevJoints={};
  function startParticles(){ particles=[]; prevJoints={}; }
  function updateParticles(){
    poses.forEach((pose,pi)=>{ for(const idx of [9,10,7,8,0,15,16]){
      const p=pose.keypoints[idx]; if(!p||p.score<KP_MIN) continue;
      const x=mapX(p.x),y=mapY(p.y),key=pi+'_'+idx,prev=prevJoints[key];
      let vx=0,vy=0,speed=0; if(prev){ vx=x-prev.x; vy=y-prev.y; speed=Math.hypot(vx,vy); }
      prevJoints[key]={x,y}; const count=Math.min(6,Math.floor(speed/6));
      for(let k=0;k<count;k++) particles.push({x,y,vx:vx*0.3+(Math.random()-0.5)*2,vy:vy*0.3+(Math.random()-0.5)*2,
        life:1,r:Math.max(3,W*0.006)*(0.6+Math.random()),c:EU_COLORS[(Math.random()*EU_COLORS.length)|0]});
    }});
    ctx.globalCompositeOperation='lighter';
    for(const pt of particles){ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=0.02;
      ctx.globalAlpha=Math.max(0,pt.life); ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pt.life+1,0,Math.PI*2);
      ctx.fillStyle=pt.c; ctx.fill(); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    particles=particles.filter(p=>p.life>0&&p.y<H+40);
    poses.forEach((pose,pi)=>drawSkeleton(pose,EU_COLORS[pi%EU_COLORS.length]));
    if(particles.length===0&&poses.length===0){ ctx.fillStyle='rgba(255,255,255,.8)'; ctx.textAlign='center';
      ctx.font='500 '+Math.round(H*0.03)+'px system-ui,sans-serif'; ctx.fillText(t('part_prompt'),W/2,H*0.5); }
  }

  /* ---- effets partagés / utils ---- */
  function burst(x,y){ return {x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:1,c:EU_COLORS[(Math.random()*EU_COLORS.length)|0]}; }
  function updateBursts(){ ctx.globalCompositeOperation='lighter';
    for(const b of game.bursts){ b.x+=b.vx; b.y+=b.vy; b.life-=0.04; ctx.globalAlpha=Math.max(0,b.life);
      ctx.beginPath(); ctx.arc(b.x,b.y,W*0.008*b.life+1,0,Math.PI*2); ctx.fillStyle=b.c; ctx.fill(); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; game.bursts=game.bursts.filter(b=>b.life>0); }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function wrapText(text,cx,cy,maxW,lh){ const words=text.split(' '); let line=''; const lines=[];
    for(const w of words){ const tt=line?line+' '+w:w; if(ctx.measureText(tt).width>maxW&&line){ lines.push(line); line=w; } else line=tt; }
    if(line) lines.push(line); const startY=cy-(lines.length-1)*lh/2; lines.forEach((l,i)=>ctx.fillText(l,cx,startY+i*lh)); }
  let flashMsg=null,flashUntil=0;
  function flash(msg){ flashMsg=msg; flashUntil=performance.now()+4000; }

  /* ---------------- Boucle ---------------- */
  async function loop(){
    if(detector){ try{ poses=await detector.estimatePoses(video,{flipHorizontal:false}); }catch(e){ poses=[]; } }
    drawVideoMirrored();
    if(mode==='quiz'){ poses.forEach(p=>drawSkeleton(p,'rgba(77,140,255,.55)')); updateQuiz(); }
    else if(mode==='catch'){ updateCatch(); }
    else if(mode==='particles'){ updateParticles(); }
    else { poses.forEach((p,i)=>drawSkeleton(p,EU_COLORS[i%EU_COLORS.length])); }
    const peopleEl=document.getElementById('people'); if(peopleEl) peopleEl.textContent=poses.length;
    if(flashMsg&&performance.now()<flashUntil){ ctx.textAlign='center'; ctx.textBaseline='middle';
      roundRect(W/2-Math.min(W*0.4,380),H*0.4,Math.min(W*0.8,760),H*0.12,20);
      ctx.fillStyle='rgba(9,20,55,.85)'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle='#ffd617'; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(H*0.038)+'px system-ui,sans-serif'; ctx.fillText(flashMsg,W/2,H*0.46); }
    requestAnimationFrame(loop);
  }

  /* ---------------- Navigation ---------------- */
  function updateHudTitle(){ const map={quiz:'hud_quiz',catch:'hud_catch',particles:'hud_particles'};
    if(map[mode]) setText('hudTitle',t(map[mode])); }
  function setMode(m){
    mode=m; if(m==='menu'){ showMenu(); return; }
    menu.classList.add('hide'); hud.style.display='flex';
    const showScore=(m==='quiz'||m==='catch');
    document.getElementById('scorePill').classList.toggle('hide',!showScore);
    document.getElementById('timePill').classList.toggle('hide',m!=='catch');
    document.getElementById('peoplePill').classList.toggle('hide',false);
    document.getElementById('score').textContent='0';
    updateHudTitle();
    if(m==='quiz') startQuiz(); if(m==='catch') startCatch(); if(m==='particles') startParticles();
  }
  function showMenu(){ mode='menu'; menu.classList.remove('hide'); hud.style.display='none'; }

  document.querySelectorAll('.mode').forEach(el=>el.addEventListener('click',()=>setMode(el.dataset.mode)));
  document.getElementById('backBtn').addEventListener('click',()=>setMode('menu'));
  document.querySelectorAll('#langsw button').forEach(b=>b.addEventListener('click',()=>{
    lang=b.dataset.lang; try{ localStorage.setItem('cor_lang',lang); }catch(e){} applyLang();
  }));
  document.getElementById('camSel').addEventListener('change',async e=>{
    const id=e.target.value;
    try{ await startCamera(id); flash(t('cam_changed')); await populateCameras(); }
    catch(err){ console.error(err); let hint=err&&err.name?err.name:'error';
      if(err&&err.name==='NotReadableError') hint=t('cam_busy');
      else if(err&&err.name==='OverconstrainedError') hint=t('cam_over');
      else if(err&&err.name==='NotAllowedError') hint=t('cam_denied');
      flash(t('cam_unavail')+hint); }
  });
  document.getElementById('fsBtn').addEventListener('click',()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
    else document.exitFullscreen&&document.exitFullscreen();
  });
  window.addEventListener('keydown',e=>{ if(e.key==='Escape') setMode('menu');
    if(e.key==='f'||e.key==='F') document.getElementById('fsBtn').click(); });

  init();
})();
</script>
</body>
